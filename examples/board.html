<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>板のサンプル</title>
<style>
body{margin:0;font-family:sans-serif;color:#333}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;background:#1a1a1a;color:#fff}
header a{color:#fff;text-decoration:none}header a.dim{color:#777;font-size:14px}
main{max-width:640px;margin:32px auto;padding:0 16px}
h1{font-size:32px;margin:0 0 16px}
p.lead{color:#999;margin:0 0 24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#f5f5f5;border:1px solid #ddd;border-radius:8px;padding:16px;overflow:hidden;height:220px}
.card h2{font-size:22px;margin:0 0 8px}
.card img{width:100%;height:120px;background:#ccc;display:block}
button{font-size:11px;padding:4px 12px;background:#06c;color:#fff;border:0;border-radius:4px}
.wide{width:900px;height:40px;background:#fee}
footer{margin-top:120px;padding:24px;background:#fafafa;color:#aaa;font-size:12px}
</style></head><body>
<header><a href="/"><strong>natadeco</strong></a><a class="dim" href="/login">Login</a></header>
<main>
<h1>ようこそ、板へ</h1>
<p class="lead">ここは、書いた人を隠さない板です。加入は軽く、貨幣は作らない。</p>
<section class="cards">
<article class="card"><h2>旅の記録</h2><img src="x.png"><p>旅の記録は、場所ごとに部屋が分かれています。写真と短い文で、その日の道を残します。長い文はあとから足せます。</p></article>
<article class="card"><h2>哲学デコ</h2><p>論語から韓非子まで、ゆっくり読む部屋。</p><button>投稿する</button></article>
</section>
<div class="wide">はみ出す箱</div>
</main>
<footer>© natadeco</footer>
</body></html>
